[package]
name = "tasahertsio"
version = "0.1.0"
edition = "2021"
description = "tasahertsiö — linear frequency-shifter demo (SSB + spectral) running in the browser via WASM"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.dev]
opt-level = 1   # DSP is too slow at -O0 to run in real time

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
log = "0.4"
console_log = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
rustfft = "6.2"

[dependencies.web-sys]
version = "0.3"
features = [
  "AudioContext",
  "AudioContextOptions",
  "AudioContextState",
  "BaseAudioContext",
  "AudioBuffer",
  "AudioBufferSourceNode",
  "AudioDestinationNode",
  "AudioNode",
  "AudioParam",
  "GainNode",
  "AnalyserNode",
  "ScriptProcessorNode",
  "AudioProcessingEvent",
  "MediaStream",
  "MediaStreamTrack",
  "MediaStreamConstraints",
  "MediaStreamAudioSourceNode",
  "MediaDevices",
  "Navigator",
  "Window",
  "Document",
  "DomRect",
  "Element",
  "HtmlElement",
  "HtmlInputElement",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "CanvasGradient",
  "Event",
  "EventTarget",
  "File",
  "FileList",
  "Blob",
  "console",
]
